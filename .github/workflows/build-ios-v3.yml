
name: Build EasyBAC V3 iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract EasyBAC V3
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f pubspec.yaml ]; then
            ZIP="EasyBAC-V3-Source.zip"

            test -f "$ZIP" || {
              echo "::error::V3 ZIP not found"
              exit 1
            }

            mkdir -p /tmp/easybac-v3
            unzip -q "$ZIP" -d /tmp/easybac-v3

            PUBSPEC="$(find /tmp/easybac-v3 -name pubspec.yaml -print -quit)"
            test -n "$PUBSPEC"

            rsync -a "$(dirname "$PUBSPEC")/" "$GITHUB_WORKSPACE/"
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create . --platforms=ios

      - name: Remove incompatible template files
        shell: bash
        run: |
          set -euo pipefail
          rm -f test/widget_test.dart
          rm -f analysis_options.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze application
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build unsigned iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA for ESign
        shell: bash
        run: |
          set -euo pipefail

          APP="build/ios/iphoneos/Runner.app"

          test -d "$APP" || {
            echo "::error::Runner.app not found"
            exit 1
          }

          mkdir -p Payload
          cp -R "$APP" Payload/Runner.app

          zip -qry EasyBAC-V3-Unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EasyBAC-V3-iOS-IPA
          path: EasyBAC-V3-Unsigned.ipa
          if-no-files-found: error
