
name: Build EasyBAC V2 iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Fixed EasyBAC V2
        shell: bash
        run: |
          set -euo pipefail

          ZIP="EasyBAC-V2-iOS-Source-Fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Fixed EasyBAC ZIP not found"
            exit 1
          fi

          mkdir -p /tmp/easybac-v2
          unzip -q "$ZIP" -d /tmp/easybac-v2

          PUBSPEC="$(find /tmp/easybac-v2 -type f -name pubspec.yaml -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi

          SOURCE="$(dirname "$PUBSPEC")"
          rsync -a "$SOURCE/" "$GITHUB_WORKSPACE/"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create . --platforms=ios

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Flutter iOS configuration
        run: flutter build ios --release --config-only --no-codesign

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          pod install

      - name: Build iOS without Apple signing
        shell: bash
        run: |
          set -uo pipefail
          set +e

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > /tmp/easybac-build.log 2>&1

          RESULT=$?
          set -e

          echo "========== BUILD ERRORS =========="
          grep -n -E \
            'error:|Error:|Exception|PhaseScriptExecution|BUILD FAILED|Target kernel_snapshot_program failed|No such file' \
            /tmp/easybac-build.log | tail -60 || true

          echo "========== LAST 50 LINES =========="
          tail -50 /tmp/easybac-build.log

          exit "$RESULT"

      - name: Upload Xcode build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EasyBAC-V2-Build-Log
          path: /tmp/easybac-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="build/ios/derived/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "::error::Runner.app not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/Runner.app

          zip -qry EasyBAC-V2-Unsigned.ipa Payload
          test -s EasyBAC-V2-Unsigned.ipa

      - name: Upload IPA for ESign
        uses: actions/upload-artifact@v4
        with:
          name: EasyBAC-V2-iOS-IPA
          path: EasyBAC-V2-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
