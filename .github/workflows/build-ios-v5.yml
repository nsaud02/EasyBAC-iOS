
name: Build EasyBAC V5 Luxury iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V5 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="EasyBAC-V5-Luxury-Source.zip"

          test -f "$ZIP" || {
            echo "::error::Upload $ZIP to repository root"
            exit 1
          }

          mkdir -p /tmp/easybac-v5
          unzip -q "$ZIP" -d /tmp/easybac-v5

          PUBSPEC="$(find /tmp/easybac-v5 \
            -type f -name pubspec.yaml -print -quit)"

          test -n "$PUBSPEC" || {
            echo "::error::pubspec.yaml missing"
            exit 1
          }

          rsync -a \
            "$(dirname "$PUBSPEC")/" \
            "$GITHUB_WORKSPACE/"

          grep -q 'class PremiumHero' lib/main.dart || {
            echo "::error::V5 UI not found"
            exit 1
          }

          echo 'EasyBAC V5 source verified'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create . --platforms=ios

      - name: Install dependencies
        run: flutter pub get

      - name: Remove incompatible template files
        run: |
          rm -f test/widget_test.dart
          rm -f analysis_options.yaml

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build unsigned iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA for ESign
        shell: bash
        run: |
          set -euo pipefail

          APP="build/ios/iphoneos/Runner.app"

          test -d "$APP" || {
            echo "::error::Runner.app missing"
            exit 1
          }

          mkdir -p Payload
          cp -R "$APP" Payload/Runner.app

          zip -qry EasyBAC-V5-Unsigned.ipa Payload

          test -s EasyBAC-V5-Unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EasyBAC-V5-iOS-IPA
          path: EasyBAC-V5-Unsigned.ipa
          if-no-files-found: error
