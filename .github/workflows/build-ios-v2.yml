
name: Build EasyBAC V2 iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract EasyBAC V2
        shell: bash
        run: |
          set -euo pipefail

          unzip -q EasyBAC-V2-iOS-Source.zip -d /tmp/easybac-v2

          PUBSPEC="$(find /tmp/easybac-v2 -type f -name pubspec.yaml -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi

          SOURCE="$(dirname "$PUBSPEC")"
          rsync -a "$SOURCE/" "$GITHUB_WORKSPACE/"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create . --platforms=ios

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Flutter iOS configuration
        run: flutter build ios --release --config-only --no-codesign

      - name: Install CocoaPods
        shell: bash
        run: |
          cd ios
          pod install

      - name: Build iOS without Apple signing
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="build/ios/derived/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "::error::Runner.app not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/Runner.app

          zip -qry EasyBAC-V2-Unsigned.ipa Payload

          test -s EasyBAC-V2-Unsigned.ipa

      - name: Upload IPA for ESign
        uses: actions/upload-artifact@v4
        with:
          name: EasyBAC-V2-iOS-IPA
          path: EasyBAC-V2-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
